<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Formulare</title>
  </head>
  <body>
    <!-- Statische Definition, damit Netlify das Formular beim Deploy erkennt. -->
    <form name="contact" method="POST" action="/" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="subject" />
      <textarea name="message"></textarea>
      <input name="company" />
    </form>
  </body>
</html>
